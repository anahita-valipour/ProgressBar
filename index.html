<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step Progress Bar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
      integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="progress-container">
        <div class="progress-track">
          <hr class="progress-bar-back" />
          <hr class="progress-bar-front" />
        </div>

        <div class="step checked">
          <span>1</span>
          <small>Personal Info</small>
        </div>
        <div class="step">
          <span>2</span>
          <small>Account Info</small>
        </div>
        <div class="step">
          <span>3</span>
          <small>Email Verification</small>
        </div>
        <div class="step">
          <span>4</span>
          <small>Plan Selection</small>
        </div>
        <div class="step">
          <span>5</span>
          <small>Complete</small>
        </div>
      </div>

      <div class="form-container">
        <div class="form-step form-step-active">
          <h2>Personal Information</h2>
          <input type="text" placeholder="First Name" />
          <input type="text" placeholder="Last Name" />
          <input type="date" placeholder="Birth Date" />
        </div>

        <div class="form-step">
          <h2>Account Information</h2>
          <input type="text" placeholder="Username" />
          <input type="password" placeholder="Password" />
          <input type="password" placeholder="Confirm Password" />
        </div>

        <div class="form-step">
          <h2>Email Verification</h2>
          <p>Please check your email and enter the verification code below:</p>
          <input type="text" placeholder="Verification Code" />
        </div>

        <div class="form-step">
          <h2>Plan Selection</h2>
          <select>
            <option value="free">Free Plan</option>
            <option value="basic">Basic Plan</option>
            <option value="premium">Premium Plan</option>
          </select>
        </div>

        <div class="form-step">
          <h2>Registration Complete!</h2>
          <p>Thank you for registering. You can now log in.</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="prev" aria-label="Previous step" disabled>
          <i class="fa fa-arrow-left"></i>
        </button>
        <button class="btn" id="next" aria-label="Next step">
          <i class="fa fa-arrow-right"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
